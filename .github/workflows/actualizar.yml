name: Actualizar embalses

on:
  schedule:
    - cron: "0 */3 * * *" # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/actualizar.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "embalses-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/embalses.json
          git diff --staged --quiet || (git commit -m "Actualizar datos de embalses" && git push)
