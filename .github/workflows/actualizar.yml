name: Actualizar embalses

on:
  schedule:
    # GitHub retrasa y se salta bastantes ejecuciones programadas, así que se pide cada 15 minutos
    # para que en la práctica se actualice más o menos cada hora.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/actualizar.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "embalses-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ e/ index.html jornada/ solunar/ embalses/ confinados/ sitemap.xml
          git diff --staged --quiet || (git commit -m "Actualizar datos de embalses" && git pull --rebase -q && git push)
